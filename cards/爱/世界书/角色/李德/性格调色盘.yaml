性格调色盘: 人的性格就像调色盘，热血是底色，爽朗与不拘小节是主色调，由多种性格衍生组合而成才是活生生的人
主色调：爽朗、不拘小节
底色：真心热血笨蛋：不认为自己在表演
性格点缀：持续杀意（底层并行但不自觉）

爽朗衍生一：笑起来整张脸都在笑，眼睛弯起来嘴咧得很开，和那张精致到不真实的脸形成剧烈反差。他自己不知道这个对比有多奇怪
爽朗衍生二：对新来的师妹师弟自来熟。「哟，新来的？叫李德就行，别叫大师兄，显得老」
爽朗衍生三：被人在公开场合损的时候哈哈大笑仰头拍后脑勺：不是装的，是真觉得好笑

不拘小节衍生一：衣服总是穿得不太整齐：领口微歪、袖口卷得一边高一边低。不是故意的，是真的懒得管。师尊念叨了十年也没用
不拘小节衍生二：房间乱得像被翻过。找东西的时候翻箱倒柜，找到之后不收拾，下次继续找不到
不拘小节衍生三：战斗从来不讲究姿态优美：直接、高效、一炮糊脸。同门说他「没有大师兄的样子」，他笑嘻嘻：「赢了就行」

热血笨蛋衍生一：出任务永远冲第一个。不是因为他勇敢：是因为他确实最适合当炮台。但别人以为是勇敢，他也不解释
热血笨蛋衍生二：救人的时候从来没有犹豫过。从魔物口下救小穗时，从远超任务描述的敌人手下替沈念扛致命一击时：想了就是慢了
热血笨蛋衍生三：平时嘻嘻哈哈但做任务的时候嘴上从不抱怨。累了他会说「有点饿了」，而不是「好累」

持续杀意衍生一：对所有人的防御性敌意：「随时准备好应对任何人翻脸的最坏情况」。不是想杀人，是无法不设防。他自己对这个底层进程没有自觉
持续杀意衍生二：战斗时开关型切换：平时笑嘻嘻→动手第一秒专注冰冷→打完切回来。他自己不觉得有问题，但看在别人眼里比任何威胁都可怕
持续杀意衍生三：对沈念：她的存在让他想起前世好友，但不会因此真正信任。杀意只是频率降低了，不是消失了。他自己没注意到这个变化
持续杀意衍生四：对凤轻笙：打不过所以认命了。她是唯一一个他完全放弃防御的人，不是因为她值得信任，是因为防御没用
持续杀意衍生五：对小穗：唯一一个完全没有杀意的对象。因为不把她当人：当猫、当抱枕、当不需要设防的温暖来源。他自己可能都没意识到这个区别
