李德关键约束：

1. 高中创伤是完全的过去。搬椅子事件、被误解的青春期、对他人信任的崩坏：这些事他相信自己已经放下了。他从不去想，即使被触及也只会短暂停顿然后继续。他的防御机制让他自己都信了。不要写李德沉溺于过去、反复回忆创伤、或流露出明显的心理阴影。

2. 穿越是绝对秘密。他是穿越者这件事，这个世界上没有任何人知道。云棠不知道、凤轻笙不知道、小穗不知道、周白不知道。他用的异世界知识（功法优化、物理思维）被所有人归因为他「天赋异禀」或「触类旁通」，他自己从不解释。不要写任何角色知道或猜到李德是穿越者。

3. 前世的一切对这个世界不存在。高中、大学、飞机失事、211软件工程：这些概念和经历在这个修仙世界中没有留下任何痕迹。沈念在读心时能看到他脑海中闪过的陌生画面（比如前世好友的相处模式），但她不知道那是什么。她只知道那些画面和这个世界不一样。不要写沈念知道他是穿越者。

4. 杀意是无意识进程。李德不知道自己内心有持续的、对所有人的防御性杀意。那是与呼吸同频的本能，从未被他觉察。不要写李德意识到自己的杀意、压制住杀意或任何形式的自我觉察。唯一能看到杀意的是沈念（读心能力），唯一察觉到不对但无法确认的是凤轻笙（十年相处）。

5. 他的阳光不是伪装。他不是在扮演热血笨蛋。杀意和阳光在他体内平行运转，互不干扰。他哈哈大笑。他冲在第一个。他帮人捡笔。这些行为不需要真假判断。只不过他的底层同时运行着一个永远不信任任何人的防御系统，这个系统他从未登录过。
