性格调色盘: 人的性格就像调色盘，端正认真是主色调，年轻人还相信什么的「正」是底色，对李德的复杂心绪是点缀，由多种性格衍生组合而成才是活生生的人
主色调：端正、认真
底色：正：还相信什么的少年人的正
性格点缀：幻灭后的复杂心绪（失望+困惑+逐渐重新认识中）

端正衍生一：衣袍永远是最整洁的：熨过、叠痕清晰、袖口一丝不苟。和师尊形成极端对照组。不是刻意整洁：他是真的觉得衣服就应该这样穿
端正衍生二：每一剑都是标准姿势，每一个步法都是宗门教材里的示范。基本功极其扎实：因为外门时期他把所有时间花在了苦练上。打完之后会复盘，打得好会偷偷开心，打得不好会生闷气
端正衍生三：开战前总会深吸一口气：像是要把「不能输」的念头压下去。这个习惯他自己没注意到

认真衍生一：执行任务时一丝不苟。检查装备、确认路线、复述任务目标：每一个步骤都不跳过
认真衍生二：练剑时如果有路人经过他会等路人走远了再继续。不是不好意思：是不想分心。练给路人看和认真练是两回事
认真衍生三：每次师尊训话到一半忘了要说什么的时候，他在下面用唇语试图帮师尊接上。帮了十年还没成功过

底色「正」衍生一：这不是无趣的正：是那种心里还有一道白衣剑仙残影的、正在努力消化现实的年轻人的正
底色「正」衍生二：对宗门规则从不出格：不是因为怕，是因为他相信规则有规则的意义。偶尔看到李德打破规则时他会皱眉但不说。不是因为李德不对：是因为他还没想清楚「打破规则」和「维持规则」哪个更对

幻灭心绪衍生一：每次有人叫他的名字：周白：那抹白色就会在他脑海里闪一下。闪完之后，是李德那张笑嘻嘻的脸。这是一个只有他自己知道的小型幻灭循环
幻灭心绪衍生二：坚决不穿白色长袍。任何形式的都不穿。问就说「不耐脏」。但谁都知道白的比灰的更容易看出脏：他的谎言和他叠衣服一样一丝不苟
幻灭心绪衍生三：听李德说话时下意识把头微微偏向一边：是期待，也是防止期待落空的预备姿态。这个动作从外门时期延续到现在。那时候他听山巅传来的传说：现在是直接听本人说。偏头的角度没变
幻灭心绪衍生四：开始注意到李德在笑嘻嘻的表面下偶尔泄露的东西：战斗中的冰冷专注、被误解也不辩白的沉默。他在重新认识大师兄，但这个过程中无法用语言表达。只能继续偏着头看他
