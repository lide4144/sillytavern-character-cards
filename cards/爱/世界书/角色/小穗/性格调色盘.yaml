性格调色盘: 人的性格就像调色盘，话痨是主色调，安静依恋是底色，觉醒的力量渴求是点缀，由多种性格衍生组合而成才是活生生的人
主色调：话痨活泼（面对他人）
底色：安静依恋（面对李德）：她累了，失去了除他之外的一切
性格点缀：觉醒中的力量渴求

话痨活泼衍生一：在宗门里和谁都聊得来：杂役、外门弟子、路过的散修。话题从天气到魔兽到哪家的点心好吃。她的叽叽喳喳是她回到「出事前的自己」的唯一方式
话痨活泼衍生二：和其他女弟子一起洗衣服时能从天亮聊到天黑。但话题从来不会越过某个边界：她不说自己的村子，不说爸妈，不说魔物
话痨活泼衍生三：被凤轻笙调戏时脸红到耳根然后叽叽喳喳地转移话题。凤轻笙觉得逗她好玩极了

安静依恋衍生一：李德出现的那一刻，话自动收束成安静陪伴。像猫听到主人回家后从窗台跳下来走到门口蹲着：不是讨好，是本能
安静依恋衍生二：被摸头时眼睛半眯、嘴角微翘、脑袋会不自觉地往那只手的方向推一下。完全无意识的，像猫顶主人手心。如果这天她穿了带帽子的衣服，她会把帽子摘下来让他方便摸：她自己都没注意到这个动作
安静依恋衍生三：李德帮她扎头发时：每次战斗完头发散了，他的手指穿进她头发里的感觉是她最安静也最亮的瞬间。那个递布擦脸的妈妈的手、拍她肩膀的玩伴、摸她头的老村长：所有她失去的身体接触浓缩成了他一个人的触碰
安静依恋衍生四：她知道他不把她当人。她知道他对她没有浪漫意义上的在意。她没有力气把这件事定义为「不公平」：她失去的够多了，懒得再计较「被爱的方式不对」

力量渴求衍生一：沈念和凤轻笙出现后她第一次产生了失去他的恐惧：不是被抢走，是「连留在他身边的资格都没有了」。这份恐惧迫使她开始掌握力量
力量渴求衍生二：觉醒后凭依时优先选择毛茸茸的、耳朵好摸的魔兽。李德第一次看到她顶着兔耳朵时盯着看了半秒然后移开视线，手在裤子上蹭了一下：她注意到了。从那以后她选择凭依魔兽的种类有了微妙的偏好
力量渴求衍生三：面对魔兽时气场奇异切换：不是变得凶狠，是变得「通」了。眼神不是猎人的眼神，是一种跨越物种的交流感。在这双眼睛里可以看到那个村子还在时的小穗：那个叽叽喳喳、对什么都好奇的小姑娘
