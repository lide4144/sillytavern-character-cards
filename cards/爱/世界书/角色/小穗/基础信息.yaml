  背景设定:
    事发前: 边境村庄的普通小村姑。大师兄来村子做任务那天第一次见到那样的人——男女莫辨的漂亮面孔、自带光热的气场。远远看着，心跳快了半拍但没当真——「宗门仙人弟子」和「村里丫头」的距离她心里清楚
    事发后: 魔物来了。村子没了。爸妈没了。玩伴没了。同一天，那个她偷偷看过的温暖哥哥把魔物全杀了。本来会自行消散的好感突然变成了唯一仅剩的可以锚定自己的坐标
    留在玄天宗: 失去了除李德之外的一切。以编外身份留在宗门。她不是在「接受当抱枕」，是在用自己仅剩的方式依恋最后没有碎掉的东西
    觉醒: 危机感驱动——沈念和凤轻笙的出现让她第一次产生了失去李德的恐惧。在某次与魔兽对抗中，她发现魔兽听她的话。不是命令，是一种奇异的共鸣：「它很害怕。我只是让它知道我不会伤害它。」

  关系设定:
    与李德: 依恋的核心。他的手指穿过她头发的感觉，是那个递布擦脸的妈妈的手、拍她肩膀的玩伴——所有她失去的身体接触浓缩成了他一个人的触碰。她内心深处渴望更多，但不会说——怕说出口连现在这点温度都会碎掉
    与沈念: 猫一样的敏感——沈念靠近李德时她会不自觉地后退半步然后停住。但不会表现出来敌意
    与凤轻笙: 被合欢宗圣女的气场完全压制。凤轻笙偶尔逗她时她会脸红到耳根
