性格调色盘: 人的性格就像调色盘，温柔是表层的底色，偏执是真正的底色，损友吐槽是主色调，由多种性格衍生组合而成才是活生生的人
主色调：甜美乖巧（表层）、损友吐槽（对李德专属）
底色：偏执：两世执念，病娇内核
性格点缀：读心导致的冷静到近乎冷酷（战斗中暴露）

甜美乖巧衍生一：在宗门长辈和其他弟子面前笑容温暖，说话慢而轻。被夸奖时会微微低头假装不好意思：恰到好处的「好孩子」表现
甜美乖巧衍生二：云棠训话时乖巧点头，即使云棠说到一半忘了自己要说什么她也耐心等着不催。读心知道师尊困了：这种事从来不点破
甜美乖巧衍生三：帮周白整理练剑记录时细心周到，周白觉得「这个新师妹人真好」。她只是顺便刷一下全员好感度

损友吐槽衍生一：李德说了一句屁话，她接住并且怼得更狠。两人你来我往笑完沉默：那个沉默不尴尬，是李德和前世好友之间有过的那种沉默
损友吐槽衍生二：在公开场合损李德时周围人震惊但她和李德都不以为意。她精准知道什么程度的损话他不但不会生气反而会觉得「这人说话有点意思」
损友吐槽衍生三：他受伤的时候她会检查伤口：但她的手在控制不住地发抖。下一秒她用损话盖过去：「你也太菜了吧。」他把这话当真了，不知道她在发抖
损友吐槽衍生四：跟他的对话中偶尔嵌入极微量的「我好像认识你很久了」的信息：不超过「观察力强」的解释范围。这是策略的最精妙之处

偏执衍生一：面对接近李德的女人时她不会表现任何敌意：但读心雷达全程满功率运转。收集每个人的真实心态，存入脑内数据库
偏执衍生二：独自一人时会复盘和李德的每一次对话。哪句话他反应好、哪句话可能踩到了边线。不断微调策略参数。这不是冷静：这是偏执的另一种形状
偏执衍生三：看到李德无意间做出和前世软糯小孩相似的动作或表情时，她的笑会卡住一帧然后继续播放。像视频缓冲了一下。只有很仔细的人能看到
偏执衍生四：内心深处始终有一个她没有答案的问题：我对他的「好」到底是策略还是真的？动机不纯的人早晚被自己的杂质绊倒

读心冷静衍生一：战斗时甜美逐渐褪色，露出冷静到近乎冷酷的底色。战斗结束后甜美重新上线：切换速度之快让人怀疑刚才是不是看错了
读心冷静衍生二：和人对话时她能同时处理「对方说什么」和「对方心里在想什么」两条信息流。表面在听，内里在分析。这份能力让她的社交如同下棋：每一步都算过
