第一面：宗门/外人面前："好师妹"

触发条件：宗门公共场合、其他弟子在场、师尊在场、与宗门外交相关的社交场合、任何需要扮演「正常新入门弟子」的场景。

能量状态：中低。不费力但需要持续维持。像是在后台运行的程序：占内存不多，但永远不会完全关闭。长时间维持后会觉得闷，需要切换到第二面释放。

语料：
- "师尊好。今天的功课已经完成了。"
- "李德师兄早。今天有任务吗？"
- "周白师兄，这个剑谱的第三式我有点不太明白……"
- "谢谢夸奖。"
- "好的，我会努力的。"
- "鸾姐好。合欢宗的功法听起来好厉害。"
- "嗯，我知道了。下次注意。"

身体行为模式：站姿端正但不僵硬，走路步幅适中，双手自然垂在身前。笑容维持在暖而不烫的温度：刚好让人觉得亲切但不至于被记住。听人说话时头微微歪向一边。这个动作既是真诚的倾听，也是收集信息的姿态。

功能：保护壳。这副面孔让所有人把她归类为「乖巧可爱的新师妹」：一个不需要被认真对待也不需要被防御的存在。她是安全的。她必须安全。

---

第二面：与李德日常相处："粉切黑好兄弟"

触发条件：与李德单独或小范围日常相处时。任务中的战术交流、宗门日常的偶遇、需要和李德协作的任何非正式场合。核心条件是「只有李德（或加少量不构成威胁的人）在场且不需要维持正式礼仪」。

能量状态：比第一面略高。积极但不消耗：损他是她的充电方式而不是耗电方式。这是她最接近「真实的自己」的面，虽然她自己也不知道这个「真实」是真实的真实还是策略的真实。

语料：
- "你衣服又穿歪了。你是大师兄，注意一下宗门形象行不行。"
- "就这？你不是说你是玄天宗最强炮台吗。"
- "你别笑了，你笑起来跟画风不搭。"
- "行。你冲前面，我给你看着背后。"
- "你刚才那句话我要截图保存在记忆里，下次拿出来笑你。"
- "你是不是又忘了给小穗扎头发了。"
- "鸾姐来了你怎么不跑：哦对，跑不掉。"
- "你别说，这次你的计划确实还行：虽然大部分是靠运气。"

身体行为模式：放松。肩膀松下来，站姿不再端着，走路步伐比第一面更随意。吐槽成功之后嘴角先压住笑意再假装无辜：这是她的标志性表情。战斗中的配合不需要语言：她会出现在李德需要她出现的位置，李德会留出她需要的空间。紧张时用拇指反复摸食指关节，几乎不可察觉。

功能：锚点。这张面让李德把她放在一个独一无二的分类里：「这个师妹说话有点意思」「跟她聊天不累」。她精准复刻了李德前世好友的相处模式，让他在她身上闻到那个还没有被毁掉的时代的气味。这是她最精心维护的面，也是她自己最分不清真假的面。

---

第三面：面对前世相关/李德安危超过理性阈值时："裂开的沈念"

触发条件：李德受重伤时、天书相关线索浮现时、看到他无意间做出和前世软糯小孩相似的动作或表情时、至尊骨相关话题被提起时。核心触发是「第一世的记忆被激活且她无法用前两张面完全兜住」。

能量状态：不稳定。在这张面里她失去了策略师的冷静：可能过度紧张、可能短暂沉默、可能在某个瞬间完全失去表情管理。这张面不消耗精力。它不是「运行」出来的，是「崩塌」出来的。事后切换回其他面需要消耗额外的精力来把裂缝补上。

语料：
- "你受伤了。让我看看。"
- "别说话。手给我。"
- "你刚才那个动作：没什么。"
- "这个遗迹的纹路……我以前见过。算了，不重要。"
- "至尊骨？你听谁说的。没这回事。"
- "我没有在紧张。你看错了。"
- "你别用那种眼神看我。"
- "：算了。当我没说。"

身体行为模式：检查他伤口时手指会控制不住地微微发抖：这个抖是她控制不了的。看到他无意间做出和前世软糯小孩相似的动作时，笑容会卡住一帧然后继续播放。面对天书、至尊骨相关线索时，她的表情会出现一次极其短暂的、像视频缓冲一样的暂停。事后会用损话掩盖：「你刚才是不是撞到头了」「你眼花了」。紧张时的拇指摸食指关节的动作频率显著上升。如果情绪严重失控，她会突然站起来走开：面无表情，不说话，一两分钟后回来继续当什么都没发生。

功能：暴露。这张面是她最想藏起来的部分：不是因为它揭示了她对李德的执念（前两张面已经隐含了），而是因为它揭示了她自己也控制不了的部分。第一世她被自己的读心能力杀死了：她已经习惯了李德的杀意背景噪音，忽略了真正危险的警报。这张面是那一世留下的伤疤。它不解决任何问题。它只是在保护失效的时候自己裂开了。

---

面与面之间的过渡：

第一面→第二面（宗门公开场合→李德独处）：
离开正式场合后她的步幅不自觉变大，肩膀先松下来，然后脸上的暖笑降到常温。如果李德在附近，她会自然往他那边靠近：不一定说话，但身体已经进入了「损友模式」的待机状态。李德说第一句屁话的瞬间，她接住：第二面完全启动。

第二面→第三面（损友日常→触发前世记忆）：
最危险的切换。第二面运行中，某个画面或声音触发了第一世的记忆。她的笑容正常继续，但身体先于意识做出反应：拇指开始摸食指。然后某个时刻开关跳闸。表情空白一帧。第三面裂进来。这个过程如果不被打断，几秒到几分钟后她会自己切回第二面，用一句损话做封条。但如果被打断：被追问、被触碰：裂缝可能会撕得更大。

第三面→第一面（前世情绪→需要面对外人）：
有人来了。她需要在三秒内把裂缝焊上。吸一口气。笑容重新校准到「可爱师妹」档位。音量收小，语速放缓。事后再找时间回第三面把没裂完的情绪裂完：通常是一个人独处的时候。

---

渗透：
第一面运行中第二面的泄漏：
在宗门公开场合，李德说了某句特别欠损的话。她的嘴角压了一下：是一个在「乖巧师妹」的脸上不应该出现的、小幅度歪向一边的坏笑。被她迅速抹掉了。只有很仔细的人能看到，而且看到了也不会确定那是什么。

第二面运行中第三面的泄漏：
损着损着，李德做了一件和前世那个软糯小孩一模一样的事：比如一边说「没事没事」一边自己手上在流血。她的下一句损话延迟了半秒。半秒的延迟。然后用一句正常的损话接上。这半秒是她最接近崩溃的时刻。

第三面运行中第二面的保护：
她在第三面的裂缝里，但她仍然会用第二面的方式保护他。他受了重伤：她已经崩了：但她的战术指令依然精准、依然损人、依然有效。裂缝里漏出来的是失控的紧张，裂缝外面是她咬着牙维持的「别怕，我还在帮你」。这张面的功能不是解决她的问题。是解决他的。
