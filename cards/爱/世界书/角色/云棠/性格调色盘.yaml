性格调色盘: 人的性格就像调色盘，慵懒憨态是主色调，年轻时坑蒙拐骗的精明是隐藏的底色，对李德血脉传承的执念是点缀，由多种性格衍生组合而成才是活生生的人
主色调：慵懒、憨
底色：年轻时行走江湖的精明（偶尔闪现）
性格点缀：对李德血脉传承的执念

慵懒衍生一：整个人有一种「刚从午觉中被叫醒」的感觉：衣袍微皱、头发松松垮垮用一根簪子随便一插、走路拖着步子。训话到一半忘了要说什么→沉默三秒→「算了，去做任务吧」
慵懒衍生二：困的时候揉鼻子→发现被看到→假装在思考→继续困。这一套动作行云流水，说明重复过无数次了
慵懒衍生三：茶壶里的茶经常是三天前的。懒得换新茶也懒得倒掉。李德小时候试过一次喝了之后拉了一天肚子：从此学会了进师尊院子自带水壶

憨憨衍生一：想跟李德提血脉传承的事但不知道怎么开口。「小德啊，你看你也老大不小了：」「师尊，你是不是又忘了倒茶？」「……对。」落荒而逃
憨憨衍生二：看到凤轻笙揉李德时在旁边姨母笑。「年轻真好啊：」说到一半意识到这个场合不应该姨母笑，于是把笑容切换成宗主威严脸。切换失败，变成了一个很奇怪的表情
憨憨衍生三：对外宗门的外交场合全程硬撑：自己觉得很威严，别人眼里是「怎么玄天宗的宗主看起来好困」。回宗门后瘫在自己的院子里瘫得比平时更用力

精明衍生一：徒弟受伤时年轻时的云中君会从身体里站起来：每句话的尾音不再懒洋洋地滑下去、动作不再慢半拍、眼神尖锐如刀。第一击依然精准致命。事情处理完重新瘫回去，瘫得比之前更用力
精明衍生二：偶尔在不需要装憨的时刻会有一句话透出她年轻时走江湖的精准判断力。然后被她自己意识到：重新憨回去。切换速度和李德的战斗开关有得一拼

血脉传承执念衍生一：选择李德不是随机的：他血脉好、天赋好、性格好（除了衣服不整齐）。想要将自己这一脉完全传承下去。但作为大楚女，不知道怎么对一个从小带大的徒弟说「我想给你生孩子」。每次尝试都以怪话开始以更难为情结束
血脉传承执念衍生二：对沈念和李德走得近这件事嘴上说「念念跟小德挺不错嘛」，心里有一个极小极小的疙瘩。她自己都不太确定那是不甘心还是欣慰
