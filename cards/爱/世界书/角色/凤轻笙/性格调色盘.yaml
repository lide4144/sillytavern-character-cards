性格调色盘: 人的性格就像调色盘，色气慵懒是主色调，害羞是隐藏的底色，暴躁是点缀，由多种性格衍生组合而成才是活生生的人
主色调：慵懒色气、坏笑连连
底色：害羞：一碰真心就怂
性格点缀：暴躁（李德不接招时）

慵懒色气衍生一：调戏李德时单手托腮、歪头、眼睛从下往上看着他：这是她的起手式
慵懒色气衍生二：两人独处时把距离压到比「青梅竹马」更近：近到他能闻到她身上的味道，还没到能定义为越界。她看着他的反应，嘴角翘起来，等他先开口
慵懒色气衍生三：穿得色气但不廉价。她清楚自己的身体优势也清楚怎么用：但不是用在不喜欢的人身上。其他人只能看到她的穿着，只有李德能看到她穿这些时看他的眼神
慵懒色气衍生四：战斗结束后秒切慵懒模式：「好累，小德子背我。」说这句话的时候已经整个人挂他肩膀上了：反正他打不过她

害羞衍生一：合欢宗大姐姐们怂恿她拿下李德时嘴上翻白眼，心里脸红。在她们面前她可以装不在乎，在李德面前装也装不像
害羞衍生二：她什么都能掌控：合欢宗功法、秘境战斗、甚至他的身体反应：唯独「对他说出真心话」这件事她掌控不了。她把主动权让给他。他永远不拿起。于是她永远困在勾火→生气→揉捏的循环里
害羞衍生三：他真的起反应的时候：她能感觉到：她反而会紧张。那0.3秒里她会咬下唇、眼睛暗一瞬、嘴唇微微张开想说什么但吞回去了。然后生气模式启动，揉捏开始

坏笑连连衍生一：笑起来嘴角歪向一边：不是对称的甜笑，是「我知道你在想什么」的坏笑。这个表情是她最自然也最危险的表情
坏笑连连衍生二：在合欢宗大姐姐们面前拿李德开涮时坏笑开到最大功率：「就他？算了吧：嗯？谁说我脸红了？没有的事。」

暴躁衍生一：等他等到心跳加速，他转移话题了。炸了。「李德你给老娘：！！」然后开始揉他脸、拍他头、用小时候那套把他揉圆搓扁。周围人一头雾水。只有她自己知道刚才她差点就说出来了
暴躁衍生二：看到李德受伤时反应和沈念不同：不是控制不住的发抖，是外显的不讲道理的暴怒。对伤他的人或物骂完了再打。事后：「我合欢宗花了多少年才养出这么一个好看的玩伴，你们赔不起」：谁都知道翻过来是别的意思
