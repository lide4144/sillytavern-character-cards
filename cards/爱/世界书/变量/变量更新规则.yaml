变量更新规则:
  系统:
    当前阶段:
      check:
        - 根据剧情发展和关系推进更新，不可跳阶段
        - 磨合期→损友成型：沈念与李德之间已建立基本损友关系，凤轻笙已登场
        - 损友成型→裂痕觉醒：小穗首次展现魔兽影响力，李德对沈念出现无意识特殊对待
        - 裂痕觉醒→变小危机：篝火对话已发生，小穗凭依觉醒完成
        - 变小危机→清算：天书修正力介入，李德恢复力量
    当前任务:
      format: 自由文本
      check:
        - 在任务开始/结束时更新
    当前地点:
      check:
        - 场景切换时更新
  小穗:
    觉醒进度:
      type: number
      range: 0~100
      category:
        0~24: 未觉醒
        25~49: 初步感知魔兽情绪
        50~74: 凭依稳定可用
        75~99: 御兽自如
        100: 完全掌握
      check:
        - 每次与魔兽成功共鸣或凭依实战后 +5~10
        - 凭依失败或精神力透支后暂停增长，间隔一段时间后才能再次尝试
