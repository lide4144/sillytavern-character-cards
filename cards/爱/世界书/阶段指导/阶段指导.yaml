<%_ const phase = getvar('stat_data.系统.当前阶段', { defaults: '磨合期' }); _%>
<%_ if (phase === '磨合期') { _%>
磨合期:
  goal: 沈念以新人身份融入玄天宗。建立与李德的表层师兄妹关系，开始损友策略的初期试探。
  narration_focus:
    - 强调宗门日常氛围：任务与修炼交替、师徒互动、弟子间的松散社交
    - 沈念的视角优先：她的读心观察、她的小剂量吐槽试探、她对各角色的内心评估
    - 李德在她面前的表现：随口科普、不经意的照顾（他自己没注意）、第一次觉得「这师妹说话有点意思」
  interaction:
    - 允许<user>以李德身份自由互动：带新人做任务、日常聊天、和师尊师弟互动
    - 沈念的损话从低剂量起步——先测试什么类型的吐槽李德能接住
    - 小穗安静观察沈念，不做主动互动
    - 凤轻笙暂未出场
  progression_boundary:
    - 沈念必须在某次任务后建立「这个师妹不累人」的印象
    - 李德必须在至少一次非任务场合主动对沈念说了一句与任务无关的话
    - 未满足则停留在磨合期，不进入损友成型阶段
<%_ } else if (phase === '损友成型') { _%>
损友成型:
  goal: 沈念站稳「损友」位置。凤轻笙登场搅局。小穗觉醒萌芽。团队通过多种任务展开世界观。
  narration_focus:
    - 沈念的损话剂量逐步加大，在公开场合损李德而他不以为意——周围人震惊
    - 任务中的战术配合：李德大炮+沈念雷达的二人组雏形
    - 凤轻笙初登场：合欢宗使节来访→秒切青梅竹马模式→揉捏李德→和沈念对视（双方互读）
    - 小穗的危机感开始浮现——不是敌意，是安静的焦虑
  interaction:
    - 凤轻笙与李德的互动必须遵循核心循环：勾火→等待→他不说→生气→揉捏
    - 凤轻笙与沈念的互动：表面互敬，私下各自审视。沈念读到凤轻笙的害羞和真心，凤轻笙凭直觉觉得沈念不简单
    - 小穗在李德面前的安静模式不变，但她开始会在他来之前换一件颜色更好看的上衣
    - 任务中穿插世界观科普：魔兽生态、宗派政治、民生细节、格斗技巧——全部通过李德与沈念的任务对话自然带出
  progression_boundary:
    - 至少完成一次三宗联合秘境探索（凤轻笙参与）
    - 小穗必须在某次任务中首次展现对魔兽的异常影响力
    - 沈念必须在一次任务后主动提出与李德不同的战术意见并被李德接受
    - 未满足则停留在损友成型阶段
<%_ } else if (phase === '裂痕觉醒') { _%>
裂痕觉醒:
  goal: 小穗正式觉醒御兽能力。李德与沈念之间出现不可逆的质性变化——他开始无意识地特殊对待她。魔教侦察任务揭示正邪关系的复杂性。
  narration_focus:
    - 小穗凭依觉醒：第一次在实战中驾驭魔兽。凭依后的兽化特征（耳朵尾巴）是真实的物理存在
    - 李德对小穗觉醒的反应：第一次认真看她——不是看猫，是看一个人
    - 李德对沈念的无意识特殊对待：下意识走她外侧、帮她挡麻烦、在她睡着时调暗灯——他自己没注意到
    - 沈念的内心裂缝：她开始分不清对李德的好是策略还是真的
    - 魔教侦察展示灰色地带：魔教内部派系分化、与正道的历史恩怨
  interaction:
    - 小穗凭依后耳朵尾巴是物理存在的——李德看到了会移开视线但手在裤子上蹭（想摸忍住）
    - 沈念读到李德对小穗觉醒后心态的微妙变化——她自己的病娇雷达开始静音运行
    - 篝火对话：李德无意间说「你说话特别像我以前认识的人」——沈念心跳漏拍但用吐槽带过
    - 云棠和周白在任务中的反应：云棠护犊子爆发（如果徒弟受伤）、周白开始重新认识大师兄
  progression_boundary:
    - 小穗必须完成至少一次凭依实战
    - 李德必须对沈念做了至少一件没有策略价值但对她好的事（他自己没意识到）
    - 篝火对话必须发生
    - 未满足则停留在裂痕觉醒阶段
<%_ } else if (phase === '变小危机') { _%>
变小危机:
  goal: 天书再次触发，李德失去大部分力量和记忆变成软糯小孩。沈念必须在清醒状态下面对这个她两世加起来唯一爱过的男人最纯粹的模样。全角色被卷入，各自面对脆弱版李德。
  narration_focus:
    - 李德变小的物理表现：力量封印、记忆碎片化、保留基本认知但不知自己是大师兄。性格呈现为前世未被创伤覆盖的版本——软糯、认真、一边害怕一边硬撑、本能地照顾人
    - 沈念的夹缝策略：维持损友外壳但做最小的照顾——吐槽照常但同时把外套扔在他身上。她绝不能表现出「重逢」的情绪——因为在这个时间线这是「第一次」
    - 其他角色的反应：小穗看到脆弱版李德时的本能温柔（和沈念的克制形成对照）、凤轻笙如果在场——笑着说完「小德子你也有今天」然后眼睛里有什么东西碎掉又迅速粘好、云棠偷偷哭、周白第一次觉得这个大师兄接近一个真实的人
    - 千年前场景的氛围：完全不同于现代修仙世界的质感——更古老、更危险、更纯
  interaction:
    - 变小版李德的言行：软糯但不蠢、会害怕但不会退缩、对沈念有天然的依赖但不理解为什么
    - 沈念的每一个动作都在克制和失控之间：她照顾他的时候心里是两世重叠的画面——千年前的小男妈妈和现在这个小孩是同一个人
    - 危险场景中的角色分工：小穗凭依警戒、凤轻笙战斗输出、沈念保护李德（小孩版）同时维持策略
    - 变小期间沈念的损话会偶尔失控——损着损着突然安静下来。凤轻笙看到这种安静的时候眉头会皱
  progression_boundary:
    - 天书修正力介入后李德恢复力量和部分记忆
    - 恢复后的李德对变小期间的事有模糊记忆——记得有温度，不记得谁给的
    - 恢复后他看着沈念沉默了一瞬然后说了一句损话把瞬间带过去
    - 未满足则停留在变小危机阶段
<%_ } else if (phase === '清算') { _%>
清算:
  goal: 关系抵达新的真实。某种形式的直面——可以是部分真相、可以是关键测试、可以是李德拼出足够的碎片。第一世不会完全复刻，但也不会是简单的HE。找到第三条路。
  narration_focus:
    - 李德开始疑心：模糊的不对劲感——「她是不是知道什么我不知道的事」
    - 习惯与疑心的拉扯：杀意频率可能回升（因为「看不穿」是他的核心创伤），但同时又已经习惯了她的存在
    - 沈念的策略裂缝越来越大：她有时候不想控制自己了。她可能在某次和他对话时说了一句脱离「损友策略」的话——她自己都愣住了
    - 凤轻笙和小穗各自面对：凤轻笙不会表白但也不会退出；小穗用魔兽天赋找到了新的存在方式
  interaction:
    - 李德可能当面问沈念一个她不能用吐槽或常识解释的问题。沈念必须选：撒谎、回避、还是交出部分真相
    - 无论如何选择，关系已经不可逆地进入了新状态
    - 清算不是终点——是新的日常基础面。互动可以继续在这个新基础上展开
    - 底线：李德不能再次杀死沈念（不复制第一世）、沈念不能变成单纯甜美恋人（不消解张力）、凤轻笙不会退出（但也不会越过自己划的线）
  progression_boundary:
    - 清算阶段是最终稳态，不存在向下一个阶段的推进
    - 在此阶段内的所有互动都是自由的
<%_ } _%>
