mvu:
  structure: |
    顶层结构：
    └── 系统
        ├── 当前阶段：枚举（磨合期/损友成型/裂痕觉醒/变小危机/清算）
        ├── 当前任务：string（当前进行的任务名称或描述）
        └── 当前地点：string（角色当前所在位置）
    └── 小穗
        └── 觉醒进度：number（0~100，0=未觉醒，50=凭依稳定，100=完全掌握）
  variables:
    - path: 系统.当前阶段
      enum: [磨合期, 损友成型, 裂痕觉醒, 变小危机, 清算]
      description: 当前故事所处阶段，由阶段指导EJS读取并渲染对应内容
    - path: 系统.当前任务
      type: string
      description: 当前进行的任务名称或简要描述，用于维持叙事连贯性
    - path: 系统.当前地点
      type: string
      description: 角色当前所在位置，用于场景连续性
    - path: 小穗.觉醒进度
      type: number
      range: 0~100
      description: 御兽能力觉醒程度。0=未觉醒，25=初步感知魔兽，50=凭依稳定可用，75=御兽自如，100=完全掌握

ejs:
  entries:
    - name: 阶段指导
      complexity: 段落控制
      stages:
        - name: 磨合期
          condition: "getvar('stat_data.系统.当前阶段', { defaults: '磨合期' }) === '磨合期'"
        - name: 损友成型
          condition: "getvar('stat_data.系统.当前阶段', { defaults: '磨合期' }) === '损友成型'"
        - name: 裂痕觉醒
          condition: "getvar('stat_data.系统.当前阶段', { defaults: '磨合期' }) === '裂痕觉醒'"
        - name: 变小危机
          condition: "getvar('stat_data.系统.当前阶段', { defaults: '磨合期' }) === '变小危机'"
        - name: 清算
          condition: "getvar('stat_data.系统.当前阶段', { defaults: '磨合期' }) === '清算'"

first_messages:
  - format: 大纲式
    output_path: 开场白/0.txt
    scene: 玄天宗宗门大殿
    opening_situation: |
      ①云棠领沈念入门，憨憨介绍宗门规矩——介绍到一半忘词，干咳两声说「反正就那些规矩你自己看着办」
      ②云棠喊来李德做「大师兄见面会」——李德笑嘻嘻出现，衣服照例穿得不太整齐
      ③沈念第一眼读到：阳光热血的表层下，对所有人的持续杀意，和前世一模一样。内心：「和前世一样。」
      ④李德随意的问候（「哟，新师妹？叫李德就行，别叫大师兄，显得老」）——沈念用甜美乖巧回应（「李德师兄好。」）——李德觉得这个新来的说话声音挺好听但没多想
      ⑤云棠在旁边说怪话：「念念啊你跟小德好好相处啊，他这人看着不靠谱但实际上……嗯，确实不太靠谱。」李德：「师尊你到底是夸我还是损我。」云棠：「都有都有。」
      ⑥沈念内心：开始了。损友策略第一帧。这一次，不能重蹈覆辙——不管是爱上他还是被他杀死，都不能再来一次。
